name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deploy
          POSTGRES_PASSWORD: deploy
          POSTGRES_DB: deploystack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run migrations
        env:
          DATABASE_URL_SYNC: postgresql://deploy:deploy@localhost:5432/deploystack
        run: |
          cd backend
          alembic upgrade head

      - name: Backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://deploy:deploy@localhost:5432/deploystack
          DATABASE_URL_SYNC: postgresql://deploy:deploy@localhost:5432/deploystack
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          ENCRYPTION_KEY: test-encryption-key-32-bytes-long!!
        run: |
          cd backend
          pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Build frontend
        run: cd frontend && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t deploystack-api ./backend

      - name: Build worker image
        run: docker build -t deploystack-worker ./worker

      - name: Build web image
        run: docker build -t deploystack-web ./frontend
