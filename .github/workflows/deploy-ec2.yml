name: Deploy to EC2

on:
  push:
    branches: [main, cursor/deployment-platform-9c59]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            APP_DIR=/opt/deploystack
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone -b cursor/deployment-platform-9c59 https://github.com/SHPDH09/free-deployment.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin cursor/deployment-platform-9c59
            git checkout cursor/deployment-platform-9c59
            git pull origin cursor/deployment-platform-9c59
            chmod +x scripts/*.sh
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build redis api worker web traefik
            docker compose exec -T api alembic upgrade head
            curl -sf http://localhost:8000/health
