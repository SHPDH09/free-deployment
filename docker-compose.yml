version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    profiles:
      - local-db
    environment:
      POSTGRES_USER: deploy
      POSTGRES_PASSWORD: deploy
      POSTGRES_DB: deploystack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploy -d deploystack"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - deploystack

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - deploystack

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://deploy:deploy@postgres:5432/deploystack}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql://deploy:deploy@postgres:5432/deploystack}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - artifacts_data:/data/artifacts
      - deployments_data:/data/deployments
      - logs_data:/data/logs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - deploystack
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${PLATFORM_DOMAIN:-platform.localhost}`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql://deploy:deploy@postgres:5432/deploystack}
      REDIS_URL: redis://redis:6379/0
      TRAEFIK_DYNAMIC_PATH: /traefik/dynamic/deployments.json
    volumes:
      - artifacts_data:/data/artifacts
      - deployments_data:/data/deployments
      - logs_data:/data/logs
      - ./traefik/dynamic:/traefik/dynamic
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    deploy:
      replicas: 1
    networks:
      - deploystack
      - traefik-public

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - deploystack
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${PLATFORM_DOMAIN:-platform.localhost}`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-public"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic
      - traefik_certs:/etc/traefik/certs
    networks:
      - traefik-public
      - deploystack

networks:
  deploystack:
    driver: bridge
  traefik-public:
    driver: bridge
    name: traefik-public

volumes:
  postgres_data:
  redis_data:
  artifacts_data:
  deployments_data:
  logs_data:
  traefik_certs:
